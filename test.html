<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test · Labonetta Voucher</title>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Bai Jamjuree', sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #856404;
      margin-bottom: 28px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; }
    p.sub { font-size: 14px; color: #6b7280; margin-bottom: 28px; }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="email"] {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid #e0d8d0; border-radius: 8px;
      font-size: 15px; font-family: inherit; color: #1a1a1a;
      outline: none; background: #f9fafb;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus { border-color: #1B7F72; background: white; }

    .items { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .item {
      border: 1.5px solid #e0d8d0; border-radius: 8px;
      padding: 16px; cursor: pointer; transition: border-color 0.2s;
      text-align: center;
    }
    .item.selected { border-color: #1B7F72; background: #e8f5f3; }
    .item input { display: none; }
    .item-amount { font-size: 20px; font-weight: 700; color: #1a1a1a; }
    .item.selected .item-amount { color: #1B7F72; }
    .item-label { font-size: 12px; color: #6b7280; margin-top: 2px; }

    .btn {
      width: 100%; padding: 14px;
      background: #1B7F72; color: white;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { background: #12574d; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }

    .spinner {
      display: none; width: 17px; height: 17px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    .btn.loading .btn-label { display: none; }
    .btn.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result {
      margin-top: 20px; padding: 16px; border-radius: 8px;
      font-size: 14px; display: none; line-height: 1.6;
    }
    .result.ok { background: #e8f5f3; border: 1px solid #1B7F72; color: #12574d; }
    .result.err { background: #fef2f2; border: 1px solid #ef4444; color: #991b1b; }
    .result.visible { display: block; }

    .code-list { margin-top: 10px; }
    .code { font-family: monospace; font-weight: 700; font-size: 15px; letter-spacing: 1px; }
  </style>
</head>
<body>
<div class="card">

  <div class="warning">
    ⚠️ Tato stránka slouží pouze k testování. Nesdílejte URL.
  </div>

  <h1>Test objednávky</h1>
  <p class="sub">Simuluje celý proces — vygeneruje voucher, uloží do Supabase a pošle PDF na email.</p>

  <div class="field">
    <label>Email pro zaslání voucherů</label>
    <input type="email" id="email" placeholder="vas@email.cz" autocomplete="email">
  </div>

  <label style="margin-bottom:10px;display:block">Vyberte vouchery</label>
  <div class="items">
    <label class="item selected" id="item-500">
      <input type="checkbox" value="500" checked>
      <div class="item-amount">500 Kč</div>
      <div class="item-label">1× voucher</div>
    </label>
    <label class="item" id="item-1000">
      <input type="checkbox" value="1000">
      <div class="item-amount">1 000 Kč</div>
      <div class="item-label">1× voucher</div>
    </label>
  </div>

  <button class="btn" id="btn" onclick="runTest()">
    <span class="btn-label">Spustit test</span>
    <span class="spinner"></span>
  </button>

  <div class="result" id="result"></div>

</div>

<script>
  document.querySelectorAll('.item').forEach(item => {
    item.addEventListener('click', () => {
      item.classList.toggle('selected')
      item.querySelector('input').checked = item.classList.contains('selected')
    })
  })

  async function runTest() {
    const email = document.getElementById('email').value.trim()
    const btn = document.getElementById('btn')
    const result = document.getElementById('result')

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      alert('Zadejte platný email.')
      return
    }

    const items = []
    if (document.getElementById('item-500').classList.contains('selected')) {
      items.push({ amount: 500, qty: 1 })
    }
    if (document.getElementById('item-1000').classList.contains('selected')) {
      items.push({ amount: 1000, qty: 1 })
    }

    if (items.length === 0) {
      alert('Vyberte alespoň jeden voucher.')
      return
    }

    btn.disabled = true
    btn.classList.add('loading')
    result.className = 'result'

    try {
      const res = await fetch('/api/test-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, items })
      })

      const data = await res.json()

      if (res.ok) {
        result.className = 'result ok visible'
        result.innerHTML = `
          <strong>✓ Test proběhl úspěšně!</strong><br>
          Email odeslán na: <strong>${email}</strong><br><br>
          <div class="code-list">
            ${data.vouchers.map(v => `
              <div>• <span class="code">${v.code}</span> — ${v.amount === 1000 ? '1 000' : v.amount} Kč</div>
            `).join('')}
          </div><br>
          Zkontroluj email a <a href="/admin.html" style="color:#1B7F72;font-weight:600">admin stránku →</a>
        `
      } else {
        result.className = 'result err visible'
        result.innerHTML = `<strong>✗ Chyba:</strong> ${data.error}`
      }
    } catch (err) {
      result.className = 'result err visible'
      result.innerHTML = `<strong>✗ Chyba spojení:</strong> ${err.message}`
    }

    btn.disabled = false
    btn.classList.remove('loading')
  }
</script>
</body>
</html>
