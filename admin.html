<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Vouchery Labonetta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:      #1B7F72;
      --teal-dark: #12574d;
      --teal-bg:   #e8f5f3;
      --terra:     #C0623A;
      --terra-bg:  #fdf0eb;
      --dark:      #1a1a1a;
      --mid:       #4a4a4a;
      --gray:      #6b7280;
      --light:     #f3f4f6;
      --border:    #e5e7eb;
      --white:     #ffffff;
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'Bai Jamjuree', sans-serif; background: var(--light); color: var(--dark); min-height: 100vh; }

    /* ── LOGIN ── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--dark);
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      background: var(--terra);
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .login-logo-mark svg { width: 28px; height: 28px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; }
    .login-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 36px 32px;
    }

    .login-card h1 {
      font-size: 22px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
    }
    .login-card p {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 28px;
      font-weight: 300;
    }

    .login-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 8px;
    }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Bai Jamjuree', sans-serif;
      color: white;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 0;
      text-align: left;
    }
    /* Přebít monospace font u tečky hesla ve Firefoxu */
    .login-input[type="password"] {
      font-family: 'Bai Jamjuree', sans-serif;
      font-size: 18px; /* tečky jsou menší než písmena, trochu zvětšit */
      letter-spacing: 3px;
    }
    .login-input[type="text"] {
      font-family: 'Bai Jamjuree', sans-serif;
      font-size: 15px;
      letter-spacing: normal;
    }
    .login-input:focus { border-color: var(--teal); }
    .login-input::placeholder { color: rgba(255,255,255,0.2); letter-spacing: normal; font-size: 15px; }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: var(--teal);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
    }
    .login-btn:hover { background: var(--teal-dark); }

    .login-error {
      color: #fc8181;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      display: none;
    }
    .login-error.visible { display: block; }

    /* ── ADMIN ── */
    #admin-screen { display: none; }

    /* Nav */
    .admin-nav {
      background: var(--dark);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 0 40px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .admin-nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .admin-nav-dot {
      width: 8px; height: 8px;
      background: var(--teal);
      border-radius: 50%;
    }
    .admin-nav-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }

    .admin-nav-right { display: flex; align-items: center; gap: 20px; }

    .btn-refresh {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      padding: 7px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-refresh:hover { border-color: rgba(255,255,255,0.3); color: white; }
    .btn-refresh svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    .btn-logout {
      background: none;
      border: none;
      color: rgba(255,255,255,0.3);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .btn-logout:hover { color: white; }

    /* Main */
    .admin-main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 36px 48px 64px;
    }

    .admin-page-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .admin-page-sub {
      font-size: 14px;
      color: var(--gray);
      font-weight: 300;
      margin-bottom: 32px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1;
    }
    .stat-value.teal  { color: var(--teal); }
    .stat-value.terra { color: var(--terra); }

    /* Filters + table header */
    .search-bar {
      margin-bottom: 16px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 11px 16px 11px 42px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: var(--dark);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(27,127,114,0.1);
    }
    .search-input::placeholder { color: #c0b8b0; }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--gray);
    }
    .search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray);
      padding: 4px;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .search-clear.visible { display: flex; }
    .search-clear:hover { color: var(--dark); }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--dark); color: var(--dark); }
    .filter-btn.active { border-color: var(--dark); background: var(--dark); color: white; }

    .table-count {
      font-size: 13px;
      color: var(--gray);
      font-weight: 400;
      white-space: nowrap;
    }
    .table-count strong { color: var(--dark); font-weight: 600; }

    /* Table */
    .table-wrap {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      padding: 12px 20px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9ca3af;
      border-bottom: 1px solid var(--border);
      background: #f9fafb;
    }

    td {
      padding: 14px 20px;
      font-size: 14px;
      border-bottom: 1px solid #f3f4f6;
      color: var(--dark);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    .code {
      font-family: monospace;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--dark);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .badge-paid     { background: var(--teal-bg); color: var(--teal); }
    .badge-paid::before { background: var(--teal); }
    .badge-pending  { background: var(--terra-bg); color: var(--terra); }
    .badge-pending::before { background: var(--terra); }
    .badge-pending-qr { background: #fff7ed; color: #c2410c; }
    .badge-pending-qr::before { background: #f97316; }
    .badge-redeemed { background: #f3f4f6; color: #6b7280; }
    .badge-redeemed::before { background: #9ca3af; }

    .amount-500  { color: var(--terra); font-weight: 700; }
    .amount-1000 { color: var(--teal);  font-weight: 700; }

    .email-cell { color: var(--gray); font-size: 13px; font-weight: 400; }
    .date-cell  { color: var(--gray); font-size: 13px; }

    /* Primární akce — fill teal */
    .btn-primary-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: var(--teal);
      color: white;
      border: 1.5px solid var(--teal);
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn-primary-action:hover { background: var(--teal-dark); border-color: var(--teal-dark); }
    .btn-primary-action:disabled { background: #d1d5db; border-color: #d1d5db; cursor: not-allowed; }

    /* Sekundární akce — outline teal */
    .btn-secondary-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: transparent;
      color: var(--teal);
      border: 1.5px solid var(--teal);
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-secondary-action:hover { background: var(--teal-bg); }
    .btn-secondary-action:disabled { border-color: #d1d5db; color: #d1d5db; cursor: not-allowed; }

    /* Zachovat .btn-redeem a .btn-dispatch jako aliasy */
    .btn-redeem  { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; background: transparent; color: var(--teal); border: 1.5px solid var(--teal); border-radius: 8px; font-size: 12px; font-family: inherit; font-weight: 600; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
    .btn-redeem:hover { background: var(--teal-bg); }
    .btn-redeem:disabled { border-color: #d1d5db; color: #d1d5db; cursor: not-allowed; }

    .btn-dispatch { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; background: var(--teal); color: white; border: 1.5px solid var(--teal); border-radius: 8px; font-size: 12px; font-family: inherit; font-weight: 600; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
    .btn-dispatch:hover { background: var(--teal-dark); border-color: var(--teal-dark); }
    .btn-dispatch:disabled { background: #d1d5db; border-color: #d1d5db; cursor: not-allowed; }
    .action-done {
      font-size: 12px;
      color: #9ca3af;
    }

    .btn-detail {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: transparent;
      color: var(--gray);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-detail:hover { border-color: var(--teal); color: var(--teal); }

    /* Detail modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.visible { display: flex; }

    .modal {
      background: var(--white);
      border-radius: 16px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-family: 'Bai Jamjuree', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--dark);
    }
    .modal-close {
      width: 32px; height: 32px;
      background: var(--light);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray);
      transition: background 0.15s;
    }
    .modal-close:hover { background: var(--border); }
    .modal-close svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    .modal-body { padding: 24px 28px 28px; }

    /* Confirm modal */
    .confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 600;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .confirm-overlay.visible { display: flex; }
    .confirm-box {
      background: var(--white);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .confirm-header {
      padding: 24px 28px 0;
    }
    .confirm-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--dark);
      margin: 0 0 8px;
    }
    .confirm-message {
      font-size: 14px;
      color: var(--gray);
      line-height: 1.6;
      margin: 0;
    }
    .confirm-meta {
      font-size: 13px;
      font-family: monospace;
      color: var(--teal);
      background: var(--teal-bg);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    .confirm-meta svg { flex-shrink: 0; }
    .confirm-footer {
      display: flex;
      gap: 10px;
      padding: 20px 28px 24px;
      justify-content: flex-end;
    }
    .confirm-cancel {
      padding: 10px 18px;
      border: 1.5px solid var(--border);
      background: white;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Bai Jamjuree', sans-serif;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.15s;
    }
    .confirm-cancel:hover { border-color: var(--dark); color: var(--dark); }
    .confirm-ok {
      padding: 10px 18px;
      border: none;
      background: var(--teal);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Bai Jamjuree', sans-serif;
      color: white;
      cursor: pointer;
      transition: background 0.15s;
    }
    .confirm-ok:hover { background: var(--teal-dark); }
    .confirm-ok.danger { background: #dc2626; }
    .confirm-ok.danger:hover { background: #b91c1c; }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--dark);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 700;
      opacity: 0;
      transition: all 0.25s;
      white-space: nowrap;
    }
    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.success { background: var(--teal); }
    .toast.error { background: #dc2626; }

    .modal-section { margin-bottom: 24px; }
    .modal-section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .modal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      font-size: 14px;
      gap: 16px;
    }
    .modal-row-label { color: var(--gray); flex-shrink: 0; }
    .modal-row-value { font-weight: 600; color: var(--dark); text-align: right; }
    .modal-row-value.mono { font-family: monospace; letter-spacing: 1px; font-size: 13px; }

    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: #9ca3af;
    }
    .empty-state svg { width: 40px; height: 40px; stroke: #d1d5db; fill: none; stroke-width: 1.5; margin-bottom: 16px; }
    .empty-state p { font-size: 14px; }

    .loading-state {
      text-align: center;
      padding: 48px;
      color: #9ca3af;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .admin-nav { padding: 0 20px; }
      .admin-main { padding: 24px 20px 48px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .table-wrap { overflow-x: auto; }
      table { min-width: 680px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo">
      <div class="login-logo-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <p class="login-title">Labonetta · Admin</p>
    </div>

    <div class="login-card">
      <h1>Přihlásit se</h1>
      <p>Správa dárkových voucherů</p>
      <label class="login-label" for="pw-input">Přístupové heslo</label>
      <div style="display:flex;align-items:stretch;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;margin-bottom:12px;transition:border-color 0.2s;" id="pw-wrap">
        <input
          class="login-input"
          type="password"
          id="pw-input"
          placeholder="••••••••"
          onkeydown="if(event.key==='Enter') login()"
          onfocus="document.getElementById('pw-wrap').style.borderColor='#1B7F72'"
          onblur="document.getElementById('pw-wrap').style.borderColor='rgba(255,255,255,0.1)'"
          autocomplete="current-password"
          style="flex:1;background:none;border:none;outline:none;padding:14px 16px;margin-bottom:0;border-radius:10px 0 0 10px;"
        >
        <div style="width:1px;background:rgba(255,255,255,0.1);margin:10px 0;flex-shrink:0;"></div>
        <button
          type="button"
          onclick="togglePw()"
          style="flex-shrink:0;width:44px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;transition:color 0.15s;border-radius:0 10px 10px 0;"
          onmouseenter="this.style.color='rgba(255,255,255,0.9)'"
          onmouseleave="this.style.color='rgba(255,255,255,0.4)'"
          aria-label="Zobrazit/skrýt heslo"
        >
          <svg id="eye-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button class="login-btn" onclick="login()">
        Přihlásit se
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
      <p class="login-error" id="login-error">Nesprávné heslo, zkuste to znovu.</p>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Detail objednávky</span>
      <button class="modal-close" onclick="closeModalDirect()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">

  <nav class="admin-nav">
    <div class="admin-nav-brand">
      <div class="admin-nav-dot"></div>
      <span class="admin-nav-title">Vouchery · Labonetta</span>
    </div>
    <div class="admin-nav-right">
      <button class="btn-refresh" onclick="loadVouchers()">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Obnovit
      </button>
      <button class="btn-logout" onclick="logout()">Odhlásit</button>
    </div>
  </nav>

  <div class="admin-main">

    <h1 class="admin-page-title">Přehled voucherů</h1>
    <p class="admin-page-sub" id="admin-date">Načítám data…</p>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Celkem prodáno</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Obrat celkem</div>
        <div class="stat-value teal" id="stat-revenue">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Nezaplacené</div>
        <div class="stat-value terra" id="stat-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Uplatněné</div>
        <div class="stat-value" id="stat-redeemed">—</div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" id="search-input" type="text" placeholder="Hledat voucher — kód, jméno, email…" oninput="handleSearch(this.value)">
      <button class="search-clear" id="search-clear" onclick="clearSearch()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Table header -->
    <div class="table-header">
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Vše</button>
        <button class="filter-btn" onclick="setFilter('paid', this)">Zaplacené</button>
        <button class="filter-btn" onclick="setFilter('pending_qr', this)">Čeká na platbu</button>
        <button class="filter-btn" onclick="setFilter('redeemed', this)">Uplatněné</button>
      </div>
      <span class="table-count" id="table-count"></span>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Kód</th>
            <th>Hodnota</th>
            <th>Jméno / E-mail</th>
            <th>Stav</th>
            <th>Objednáno</th>
            <th>Akce</th>
          </tr>
        </thead>
        <tbody id="voucher-table">
          <tr><td colspan="7" class="loading-state">Načítám…</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script>
  let password = ''
  let allVouchers = []
  let currentFilter = 'all'
  let searchQuery = ''

  // Obnov session po refreshi — nepředvyplňuj input, jen se tiše přihlas
  window.addEventListener('load', () => {
    const saved = sessionStorage.getItem('admin_pw')
    if (saved) {
      password = saved
      loadVouchers()
    }
  })

  function login() {
    const pw = document.getElementById('pw-input').value
    if (!pw) return
    password = pw
    sessionStorage.setItem('admin_pw', pw)
    loadVouchers()
  }

  function logout() {
    password = ''
    sessionStorage.removeItem('admin_pw')
    document.getElementById('admin-screen').style.display = 'none'
    document.getElementById('login-screen').style.display = 'flex'
    document.getElementById('pw-input').value = ''
    document.getElementById('login-error').classList.remove('visible')
  }

  async function loadVouchers() {
    const res = await fetch('/api/vouchers', {
      headers: { 'Authorization': `Bearer ${password}` }
    })

    if (res.status === 401) {
      sessionStorage.removeItem('admin_pw')
      document.getElementById('login-error').classList.add('visible')
      document.getElementById('admin-screen').style.display = 'none'
      document.getElementById('login-screen').style.display = 'flex'
      return
    }

    document.getElementById('login-error').classList.remove('visible')
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('admin-screen').style.display = 'block'

    allVouchers = await res.json()

    const now = new Date().toLocaleTimeString('cs', { hour: '2-digit', minute: '2-digit' })
    document.getElementById('admin-date').textContent = `Aktualizováno: ${now}`

    updateStats()
    renderTable()
  }

  // Auto-refresh každé 2 minuty
  setInterval(() => {
    if (password) loadVouchers()
  }, 2 * 60 * 1000)

  function updateStats() {
    const paid = allVouchers.filter(v => v.status === 'paid' || v.status === 'redeemed')
    const revenue = paid.reduce((sum, v) => sum + v.amount, 0)
    const pending = allVouchers.filter(v => v.status === 'pending').length
    const redeemed = allVouchers.filter(v => v.status === 'redeemed').length

    document.getElementById('stat-total').textContent = paid.length
    document.getElementById('stat-revenue').textContent = revenue.toLocaleString('cs') + ' Kč'
    document.getElementById('stat-pending').textContent = pending
    document.getElementById('stat-redeemed').textContent = redeemed
  }

  function setFilter(filter, btn) {
    currentFilter = filter
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    renderTable()
  }

  function handleSearch(val) {
    searchQuery = val.trim().toLowerCase()
    document.getElementById('search-clear').classList.toggle('visible', searchQuery.length > 0)
    renderTable()
  }

  function clearSearch() {
    searchQuery = ''
    document.getElementById('search-input').value = ''
    document.getElementById('search-clear').classList.remove('visible')
    renderTable()
  }

  function renderTable() {
    let filtered = currentFilter === 'all'
      ? allVouchers
      : allVouchers.filter(v => v.status === currentFilter)

    if (searchQuery) {
      filtered = filtered.filter(v =>
        v.code?.toLowerCase().includes(searchQuery) ||
        v.email?.toLowerCase().includes(searchQuery) ||
        v.customer_name?.toLowerCase().includes(searchQuery) ||
        v.variable_symbol?.includes(searchQuery)
      )
    }

    const count = document.getElementById('table-count')
    count.innerHTML = `<strong>${filtered.length}</strong> voucher${filtered.length === 1 ? '' : 'ů'}`
    const tbody = document.getElementById('voucher-table')

    if (filtered.length === 0) {
      tbody.innerHTML = `
        <tr><td colspan="7">
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <p>Žádné vouchery v této kategorii</p>
          </div>
        </td></tr>`
      return
    }

    // Seskupit podle variable_symbol — jedna objednávka = jeden VS
    const groups = []
    const vsMap = {}
    for (const v of filtered) {
      const key = v.variable_symbol || v.id
      if (!vsMap[key]) { vsMap[key] = []; groups.push(key) }
      vsMap[key].push(v)
    }

    const badgeMap = {
      paid:       { cls: 'badge-paid',       label: 'Zaplaceno' },
      pending:    { cls: 'badge-pending',     label: 'Čeká' },
      pending_qr: { cls: 'badge-pending-qr', label: 'Čeká na platbu' },
      redeemed:   { cls: 'badge-redeemed',   label: 'Uplatněno' },
    }

    let html = ''
    for (const [gi, key] of groups.entries()) {
      const group = vsMap[key]
      const rowspan = group.length

      group.forEach((v, i) => {
        const dt = new Date(v.created_at)
        const created = dt.toLocaleDateString('cs', { day: '2-digit', month: '2-digit', year: 'numeric' })
        const createdTime = dt.toLocaleTimeString('cs', { hour: '2-digit', minute: '2-digit' })
        const expires = new Date(v.expires_at).toLocaleDateString('cs', { day: '2-digit', month: '2-digit', year: 'numeric' })
        const badge = badgeMap[v.status] || { cls: '', label: v.status }
        const amountClass = v.amount === 500 ? 'amount-500' : 'amount-1000'
        const amountStr = v.amount === 1000 ? '1 000 Kč' : '500 Kč'
        const vs = v.variable_symbol || ''
        const shortId = vs ? vs.slice(-4) : v.id.slice(-4)
        const groupTop = i === 0 && gi > 0 ? 'border-top:2px solid #e5e7eb;' : ''

        // Akce — dispatch s rowspan jen na prvním řádku, uplatnit na každém
        let actionCell = ''
        if (i === 0 && v.status === 'pending_qr') {
          const action = `
            <div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px;">
              <button class="btn-dispatch" onclick="dispatchQr('${vs}', this)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><polyline points="22 2 11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                Zaplaceno
              </button>
              <a href="#" onclick="openDetail('${v.id}');return false;" style="font-size:12px;color:var(--teal);text-decoration:underline;text-underline-offset:3px;">Detail</a>
            </div>`
          actionCell = `<td rowspan="${rowspan}" style="vertical-align:middle;border-left:1px solid #f3f4f6;">${action}</td>`
        } else if (v.status === 'pending_qr' && i > 0) {
          actionCell = ''
        } else if (v.status === 'paid') {
          actionCell = `<td>
            <div style="display:flex;align-items:center;gap:12px;">
              <button class="btn-redeem" onclick="redeem('${v.id}', this)">Uplatnit</button>
              <a href="#" onclick="openDetail('${v.id}');return false;" style="font-size:12px;color:var(--teal);text-decoration:underline;text-underline-offset:3px;">Detail</a>
            </div>
          </td>`
        } else if (v.status === 'redeemed') {
          actionCell = `<td>
            <div style="display:flex;align-items:center;gap:12px;">
              <span class="action-done">Uplatněno</span>
              <a href="#" onclick="openDetail('${v.id}');return false;" style="font-size:12px;color:var(--teal);text-decoration:underline;text-underline-offset:3px;">Detail</a>
            </div>
          </td>`
        } else {
          actionCell = `<td><span class="action-done">—</span></td>`
        }

        html += `
          <tr style="${groupTop}">
            <td style="font-family:monospace;font-size:13px;color:#9ca3af;font-weight:600;">#${shortId}</td>
            <td><span class="code">${v.code}</span></td>
            <td><span class="${amountClass}">${amountStr}</span></td>
            <td>
              ${v.customer_name ? `<p style="font-size:13px;font-weight:600;color:var(--dark);margin:0 0 2px;">${v.customer_name}</p>` : ''}
              <p class="email-cell" style="margin:0;">${v.email}</p>
            </td>
            <td><span class="badge ${badge.cls}">${badge.label}</span></td>
            <td class="date-cell">${created} <strong style="font-weight:600;color:var(--dark);">${createdTime}</strong></td>
            ${actionCell}
          </tr>`
      })
    }
    tbody.innerHTML = html
  }

  // Custom confirm dialog
  function showConfirm({ title, message, meta, okLabel = 'Potvrdit', danger = false, onOk }) {
    document.getElementById('confirm-title').textContent = title
    document.getElementById('confirm-message').textContent = message
    const metaEl = document.getElementById('confirm-meta')
    if (meta) {
      metaEl.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#1B7F72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>${meta}`
      metaEl.style.display = 'flex'
    }
    else { metaEl.style.display = 'none' }
    const okBtn = document.getElementById('confirm-ok')
    okBtn.textContent = okLabel
    okBtn.className = 'confirm-ok' + (danger ? ' danger' : '')
    document.getElementById('confirm-overlay').classList.add('visible')
    const newOk = okBtn.cloneNode(true)
    okBtn.parentNode.replaceChild(newOk, okBtn)
    const cancelBtn = document.getElementById('confirm-cancel')
    const newCancel = cancelBtn.cloneNode(true)
    cancelBtn.parentNode.replaceChild(newCancel, cancelBtn)
    document.getElementById('confirm-ok').addEventListener('click', () => {
      document.getElementById('confirm-overlay').classList.remove('visible')
      onOk()
    })
    document.getElementById('confirm-cancel').addEventListener('click', () => {
      document.getElementById('confirm-overlay').classList.remove('visible')
    })
  }

  // Toast notification
  let toastTimer
  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast')
    toast.textContent = message
    toast.className = `toast ${type} visible`
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { toast.className = 'toast' }, 3500)
  }

  async function dispatchQr(vs, btn) {
    showConfirm({
      title: 'Potvrdit platbu a odeslat vouchery',
      message: 'Zákazníkovi bude odeslán email s PDF vouchery.',
      meta: `VS: ${vs}`,
      okLabel: 'Odeslat vouchery',
      onOk: async () => {
        btn.disabled = true
        btn.textContent = 'Odesílám…'
        const res = await fetch('/api/dispatch-vouchers', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${password}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ vs })
        })
        const data = await res.json()
        if (res.ok) {
          allVouchers = allVouchers.map(v =>
            v.variable_symbol === vs ? { ...v, status: 'paid', paid_at: new Date().toISOString() } : v
          )
          updateStats()
          renderTable()
          showToast(`✓ Vouchery odeslány na ${data.sent_to}`)
        } else {
          showToast(`Chyba: ${data.error}`, 'error')
          btn.disabled = false
          btn.textContent = 'Zaplaceno → Odeslat vouchery'
        }
      }
    })
  }

  async function redeem(id, btn) {
    showConfirm({
      title: 'Uplatnit voucher',
      message: 'Voucher bude označen jako uplatněný. Tuto akci nelze vrátit.',
      okLabel: 'Uplatnit',
      onOk: async () => {
        btn.disabled = true
        btn.textContent = '…'
        const res = await fetch('/api/vouchers', {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${password}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ id })
        })
        if (res.ok) {
          const updated = await res.json()
          const idx = allVouchers.findIndex(v => v.id === id)
          if (idx !== -1) allVouchers[idx] = updated
          updateStats()
          renderTable()
          showToast('✓ Voucher uplatněn')
        } else {
          showToast('Chyba při uplatňování voucheru.', 'error')
          btn.disabled = false
          btn.textContent = 'Uplatnit'
        }
      }
    })
  }

  function togglePw() {
    const input = document.getElementById('pw-input')
    const icon  = document.getElementById('eye-icon')
    const show  = input.type === 'password'
    input.type  = show ? 'text' : 'password'
    icon.innerHTML = show
      ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`
  }

  function openDetail(id) {
    const v = allVouchers.find(x => x.id === id)
    if (!v) return

    const badgeMap = {
      paid:       { cls: 'badge-paid',       label: 'Zaplaceno' },
      pending:    { cls: 'badge-pending',     label: 'Čeká' },
      pending_qr: { cls: 'badge-pending-qr', label: 'Čeká na platbu' },
      redeemed:   { cls: 'badge-redeemed',   label: 'Uplatněno' },
    }
    const badge = badgeMap[v.status] || { cls: '', label: v.status }
    const created    = new Date(v.created_at).toLocaleString('cs', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
    const expires    = new Date(v.expires_at).toLocaleDateString('cs', { day: '2-digit', month: '2-digit', year: 'numeric' })
    const paidAt     = v.paid_at     ? new Date(v.paid_at).toLocaleString('cs',     { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'
    const redeemedAt = v.redeemed_at ? new Date(v.redeemed_at).toLocaleString('cs', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'
    const vs     = v.variable_symbol || '—'
    const amtStr = v.amount === 1000 ? '1 000 Kč' : '500 Kč'

    document.getElementById('modal-title').textContent = `Detail · ${v.code}`
    document.getElementById('modal-body').innerHTML = `
      <div class="modal-section">
        <p class="modal-section-title">Voucher</p>
        <div class="modal-row"><span class="modal-row-label">Kód</span><span class="modal-row-value mono">${v.code}</span></div>
        <div class="modal-row"><span class="modal-row-label">Hodnota</span><span class="modal-row-value">${amtStr}</span></div>
        <div class="modal-row"><span class="modal-row-label">Stav</span><span class="badge ${badge.cls}" style="font-size:11px;">${badge.label}</span></div>
        <div class="modal-row"><span class="modal-row-label">Platí do</span><span class="modal-row-value">${expires}</span></div>
        ${vs !== '—' ? `<div class="modal-row"><span class="modal-row-label">Variabilní symbol</span><span class="modal-row-value mono">${vs}</span></div>` : ''}
      </div>
      <div class="modal-section">
        <p class="modal-section-title">Zákazník</p>
        <div class="modal-row"><span class="modal-row-label">Jméno</span><span class="modal-row-value">${v.customer_name || '<span style="color:#9ca3af;font-weight:400;">neuvedeno</span>'}</span></div>
        <div class="modal-row"><span class="modal-row-label">E-mail</span><span class="modal-row-value">${v.email}</span></div>
        ${v.customer_phone ? `<div class="modal-row"><span class="modal-row-label">Telefon</span><span class="modal-row-value">${v.customer_phone}</span></div>` : `<div class="modal-row"><span class="modal-row-label">Telefon</span><span class="modal-row-value" style="color:#9ca3af;font-weight:400;">neuvedeno</span></div>`}
      </div>
      <div class="modal-section">
        <p class="modal-section-title">Časová osa</p>
        <div class="modal-row"><span class="modal-row-label">Objednáno</span><span class="modal-row-value">${created}</span></div>
        <div class="modal-row"><span class="modal-row-label">Zaplaceno</span><span class="modal-row-value">${paidAt}</span></div>
        <div class="modal-row"><span class="modal-row-label">Uplatněno</span><span class="modal-row-value">${redeemedAt}</span></div>
      </div>
    `
    document.getElementById('modal-overlay').classList.add('visible')
    document.body.style.overflow = 'hidden'
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModalDirect()
  }

  function closeModalDirect() {
    document.getElementById('modal-overlay').classList.remove('visible')
    document.body.style.overflow = ''
  }
</script>

<!-- Confirm modal -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-header">
      <p class="confirm-title" id="confirm-title"></p>
      <p class="confirm-message" id="confirm-message"></p>
      <span class="confirm-meta" id="confirm-meta" style="display:none;"></span>
    </div>
    <div class="confirm-footer">
      <button class="confirm-cancel" id="confirm-cancel">Zrušit</button>
      <button class="confirm-ok" id="confirm-ok">Potvrdit</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

</body>
</html>
