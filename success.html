<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platba proběhla úspěšně · Labonetta</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --teal: #1B7F72; --terra: #C0623A; --light: #f5f0eb; }
    body {
      font-family: 'Lato', sans-serif;
      background: var(--light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #f0faf8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--teal);
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 8px;
    }
    .note {
      margin-top: 24px;
      padding: 16px 20px;
      background: var(--light);
      border-radius: 8px;
      font-size: 13px;
      color: #888;
    }
    .btn {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 28px;
      background: var(--teal);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .logo {
      margin-bottom: 32px;
      font-size: 11px;
      letter-spacing: 5px;
      color: #ccc;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Labonetta</div>
    <div class="icon">🍕</div>
    <h1>Platba proběhla!</h1>
    <p>Váš voucher byl odeslán na zadaný email.</p>
    <p>Zkontrolujte prosím svou schránku — PDF najdete v příloze.</p>
    <div class="note">
      Voucher platí 1 rok od dnešního dne.<br>
      Uplatníte ho osobně na naší provozovně Prosek.
    </div>
    <a class="btn" href="https://prosek.labonetta.cz">Rezervovat stůl →</a>
  </div>
</body>
</html>
